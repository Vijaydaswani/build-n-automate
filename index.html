    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --sketch-radius-1: 255px 15px 225px 15px/15px 225px 15px 255px;
        --sketch-radius-2: 15px 225px 15px 255px/255px 15px 225px 15px;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fcfcfc;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .sketch-border {
        border: 2px solid #374151;
        border-radius: var(--sketch-radius-1);
      }
      .sketch-border-alt {
        border: 2px solid #374151;
        border-radius: var(--sketch-radius-2);
      }
      .sketch-button {
        border: 2px solid #374151;
        border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        transition: all 0.2s ease;
      }
      .sketch-button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px 0px #374151;
      }
      .sketch-card {
        border: 2px solid #374151;
        border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
        transition: transform 0.2s ease;
      }
      .sketch-card:hover {
        transform: rotate(-1deg) scale(1.02);
      }
      .divider {
        height: 2px;
        background: #374151;
        border-radius: 100%;
        opacity: 0.3;
      }
      .hand-drawn-line {
        filter: url(#rough-filter);
      }
      .bubble-pop-arena {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 250, 240, 0.92)),
          repeating-linear-gradient(0deg, rgba(55, 65, 81, 0.045) 0 1px, transparent 1px 38px),
          #fffaf0;
        isolation: isolate;
      }
      .bubble-pop-arena::before {
        position: absolute;
        inset: -30% -12%;
        content: "";
        background: linear-gradient(105deg, transparent 38%, rgba(37, 99, 235, 0.08) 48%, transparent 58%);
        animation: bubbleScan 5.8s linear infinite;
        pointer-events: none;
      }
      .bubble-pop-orbit {
        animation: bubbleFloat var(--float-duration, 4s) ease-in-out infinite;
        animation-delay: var(--float-delay, 0s);
      }
      .bubble-pop-bubble {
        position: relative;
        animation: bubbleWobble 2.6s ease-in-out infinite;
        animation-delay: var(--float-delay, 0s);
      }
      .bubble-pop-bubble::after {
        position: absolute;
        inset: -10px;
        content: "";
        border: 2px solid rgba(37, 99, 235, 0.22);
        border-radius: 9999px;
        opacity: 0;
        animation: bubblePop 3.4s ease-out infinite;
        animation-delay: var(--pop-delay, 0s);
      }
      .bubble-pop-reticle {
        position: absolute;
        width: 74px;
        height: 74px;
        border: 2px dashed rgba(37, 99, 235, 0.42);
        border-radius: 9999px;
        animation: reticleChase 6s ease-in-out infinite;
        pointer-events: none;
      }
      .bubble-pop-reticle::before,
      .bubble-pop-reticle::after {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 16px;
        height: 2px;
        content: "";
        background: rgba(37, 99, 235, 0.72);
        transform: translate(-50%, -50%);
      }
      .bubble-pop-reticle::after {
        width: 2px;
        height: 16px;
      }
      .bubble-pop-hud {
        animation: hudPulse 2.8s ease-in-out infinite;
      }
      .bubble-pop-title {
        animation: titleNudge 3.6s steps(1, end) infinite;
      }
      @keyframes bubbleScan {
        from {
          transform: translateX(-65%) rotate(-5deg);
        }
        to {
          transform: translateX(65%) rotate(-5deg);
        }
      }
      @keyframes bubbleFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(var(--float-x, 10px), var(--float-y, -18px), 0);
        }
      }
      @keyframes bubbleWobble {
        0%,
        100% {
          transform: scale(1) rotate(-1deg);
        }
        50% {
          transform: scale(1.04) rotate(2deg);
        }
      }
      @keyframes bubblePop {
        0%,
        58% {
          opacity: 0;
          transform: scale(0.78);
        }
        70% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
          transform: scale(1.32);
        }
      }
      @keyframes reticleChase {
        0%,
        100% {
          transform: translate(14%, 24%);
        }
        28% {
          transform: translate(52%, 6%);
        }
        56% {
          transform: translate(70%, 43%);
        }
        78% {
          transform: translate(28%, 58%);
        }
      }
      @keyframes hudPulse {
        0%,
        100% {
          transform: translateY(0);
          box-shadow: none;
        }
        50% {
          transform: translateY(-2px);
          box-shadow: 4px 4px 0 0 rgba(55, 65, 81, 0.2);
        }
      }
      @keyframes titleNudge {
        0%,
        92%,
        100% {
          transform: translateX(0);
        }
        94% {
          transform: translateX(2px);
        }
        96% {
          transform: translateX(-2px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bubble-pop-arena::before,
        .bubble-pop-orbit,
        .bubble-pop-bubble,
        .bubble-pop-bubble::after,
        .bubble-pop-reticle,
        .bubble-pop-hud,
        .bubble-pop-title {
          animation: none;
        }
      }
    </style>

    <!-- SVG Filter for rough edges -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true" focusable="false">
      <defs>
        <filter id="rough-filter">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
        </filter>
      </defs>
    </svg>

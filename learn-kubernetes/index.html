    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #fdfcf0;
            --ink-color: #1a1a1a;
            --sketch-border: 2px solid var(--ink-color);
            --surface-bg: #ffffff;
            --muted-text: #4b5563;
            --terminal-bg: #1a1a1a;
            --terminal-text: #4ade80;
        }

        .dark-mode {
            --paper-bg: #121212;
            --ink-color: #fdfcf0;
            --surface-bg: #1e1e1e;
            --muted-text: #9ca3af;
            --terminal-bg: #000000;
            --terminal-text: #22c55e;
            background-image: radial-gradient(#333 1px, transparent 1px) !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--paper-bg);
            color: var(--ink-color);
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
            margin: 0;
            padding: 0;
            /* Scroll safety rule: do not hide overflow on body globally */
            overflow-x: hidden;
            overflow-y: auto;
        }

        .sketch-font { font-family: 'Architects Daughter', cursive; }
        
        .sketch-border {
            border: var(--sketch-border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }

        .sketch-button {
            border: var(--sketch-border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            transition: transform 0.1s ease, background-color 0.2s;
            cursor: pointer;
            text-align: center;
            display: inline-block;
            pointer-events: auto !important;
        }

        .sketch-button:active { transform: scale(0.96); }

        .rough-box {
            border: 2px solid currentColor;
            padding: 1.5rem;
            border-radius: 12px 2px 12px 2px/2px 12px 2px 12px;
            background-color: var(--surface-bg);
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .sketch-border {
                border-radius: 12px 2px 12px 2px/2px 12px 2px 12px !important;
            }
            
            .sketch-button {
                border-radius: 12px 2px 12px 2px/2px 12px 2px 12px !important;
                min-height: 44px; /* iOS touch target minimum */
            }
            
            /* Improve readability on small screens */
            body {
                font-size: 16px;
                line-height: 1.5;
            }
            
            /* Better spacing for mobile */
            .space-y-12 > * + * { margin-top: 2rem; }
            .space-y-16 > * + * { margin-top: 3rem; }
            
            /* Ensure touch targets are adequate */
            button, .cursor-pointer {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* Prevent horizontal scroll on mobile */
        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        /* Better focus states for accessibility */
        button:focus-visible, input:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; overflow: visible !important; }
            .sketch-border { border-radius: 0 !important; border: 1px solid black !important; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        .dark-mode ::-webkit-scrollbar-thumb { background: #4b5563; }
    </style>
